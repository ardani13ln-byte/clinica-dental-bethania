name: Respaldo semanal BD

on:
  schedule:
    # Domingos 09:00 UTC = 03:00 America/Guatemala
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Respaldo pg_dump
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl ca-certificates gnupg > /dev/null
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          ARCHIVO="respaldo-$(date +%Y%m%d-%H%M%S).dump"
          pg_dump "$DATABASE_URL" --format=custom --compress=9 \
            --no-owner --no-privileges --file="$ARCHIVO"
          ls -la "$ARCHIVO"
          echo "ARCHIVO=$ARCHIVO" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Cifrar respaldo (gpg)
        run: |
          echo "$BACKUP_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$ARCHIVO.gpg" "$ARCHIVO"
          shred -u "$ARCHIVO"
          ls -la "$ARCHIVO.gpg"
          echo "ARCHIVO=$ARCHIVO.gpg" >> "$GITHUB_ENV"
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Verificar integridad
        run: |
          echo "$BACKUP_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            -o /tmp/verificar.dump -d "$ARCHIVO"
          pg_restore --list /tmp/verificar.dump | grep -c "TABLE DATA"
          pg_restore --list /tmp/verificar.dump | grep "TABLE DATA public patients" \
            || (echo "Falta tabla patients" && exit 1)
          shred -u /tmp/verificar.dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Guardar artefacto cifrado (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-bd-cifrado
          path: ${{ env.ARCHIVO }}
          retention-days: 90
